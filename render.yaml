# Render Blueprint: 手機頁「補跑某天」代理 (trigger/app.py). Render Dashboard → New → Blueprint → 選這個 repo.
# 部署後到 Environment 填 GH_TOKEN (GitHub fine-grained token, 只給 quant_trading 的 Actions: Read and write) 與 API_PIN (自訂)。
services:
  - type: web
    name: quant-trigger
    runtime: python
    plan: free
    rootDir: trigger
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GH_TOKEN
        sync: false
      - key: API_PIN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
