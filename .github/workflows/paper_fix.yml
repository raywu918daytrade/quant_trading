name: Paper ledger fix (unfilled covers → close price estimate)
on:
  workflow_dispatch:
    inputs:
      date:
        description: "要補正的日期 YYYY-MM-DD"
        required: true
      times:
        description: "從永豐 list_trades 補成交時間 (只限當天收盤後)"
        type: boolean
        default: false
jobs:
  fix:
    strategy:
      matrix:
        variant: [sr, base]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q shioaji requests pandas huggingface_hub
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SINOPAC_API_KEY: ${{ secrets.SINOPAC_API_KEY }}
          SINOPAC_SECRET_KEY: ${{ secrets.SINOPAC_SECRET_KEY }}
        run: |
          set -o pipefail
          T=""; if [ "${{ inputs.times }}" = "true" ]; then T="--times"; fi
          python3 scripts/paper_fix_unfilled.py --date "${{ inputs.date }}" --variant "${{ matrix.variant }}" $T --publish 2>&1 | grep -v -i "api_key\|secret\|Session Property"
