name: Check live precompute == full recompute
on:
  workflow_dispatch:
    inputs:
      date:
        description: "當作「今天」的歷史日 YYYY-MM-DD (空白 = D1 最後一天)"
        default: ""
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - run: python3 -c "import sys; sys.path.insert(0, 'scripts'); from daily_candidates import refresh_d1; refresh_d1(6)"
      - run: |
          D="${{ inputs.date }}"
          if [ -n "$D" ]; then python3 scripts/check_live_prep.py --date "$D"; else python3 scripts/check_live_prep.py; fi
      - name: Time the TWSE MIS open-price fetch (same stock list as 09:01)
        run: |
          python3 - <<'PY'
          import sys, time; sys.path.insert(0, "scripts")
          import pandas as pd, daily_candidates as DC
          d1 = pd.read_parquet(DC.ROOT/"data/processed/d1.parquet"); last = d1.date.max()
          need = DC.prepare_live(d1, last, last + pd.Timedelta(days=1))["need"]
          for w in (1, 4):
              t = time.time(); op = DC.fetch_twse_opens(need.stock_id.tolist(), need.market_type.tolist(), workers=w)
              print(f"MIS {len(need)} 檔 (workers={w}): {time.time()-t:.1f} 秒, 取得 {op.open.notna().sum()} 檔, 不重複 {op.stock_id.nunique()} 檔")
          t = time.time()
          import daytrade_list as DL; DL.fetch_daytrade_eligible(last)
          print(f"現沖資格: {time.time()-t:.1f} 秒")
          PY
      - name: End-to-end live path (next day, opens = last D1 opens via --open-csv; no publish)
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, "scripts")
          import pandas as pd, daily_candidates as DC
          d1 = pd.read_parquet(DC.ROOT/"data/processed/d1.parquet"); last = d1.date.max()
          d1[d1.date == last][["stock_id","open"]].to_csv("/tmp/opens.csv", index=False)
          nxt = last + pd.offsets.BDay(1); open("/tmp/next", "w").write(str(nxt.date()))
          PY
          python3 -u scripts/daily_candidates.py --variant all --date "$(cat /tmp/next)" --open-csv /tmp/opens.csv --at 00:00 | head -40
