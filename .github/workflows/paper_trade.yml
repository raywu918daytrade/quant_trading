name: Paper trade (Sinopac simulation, 09:01-13:35)
on:
  schedule:
    # 平日台灣 08:56 = UTC 00:56 啟動; 腳本自己等 HF 名單 (最晚 09:10) 與 09:01 進場, 跑到 13:35
    - cron: "56 0 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "名單日期 YYYY-MM-DD (留空=今天)"
        default: ""
concurrency:
  group: paper-trade
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q shioaji requests pandas huggingface_hub
      - name: Run paper trading in Sinopac simulation environment
        env:
          SINOPAC_API_KEY: ${{ secrets.SINOPAC_API_KEY }}
          SINOPAC_SECRET_KEY: ${{ secrets.SINOPAC_SECRET_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -n "$D" ]; then python3 scripts/paper_trade.py --publish --date "$D"; else python3 scripts/paper_trade.py --publish; fi
      - name: Upload paper results as run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/
          if-no-files-found: ignore
          retention-days: 90
