name: Paper trade (Sinopac simulation, 09:01-13:35)
on:
  # 不用 GitHub 自己的 schedule, 只由 cron-job.org 於平日台灣 08:50 打 workflow_dispatch (見 scripts/setup_cronjob.py)。
  # 腳本自己等 HF 名單 (最晚 09:10) 與 09:01 進場, 跑到 13:35; 若超過 09:04 才進場會自動放棄。
  workflow_dispatch:
    inputs:
      date:
        description: "名單日期 YYYY-MM-DD (留空=今天)"
        default: ""
concurrency:
  group: paper-trade-${{ github.event.inputs.date }}
  cancel-in-progress: false
jobs:
  paper:
    strategy:
      fail-fast: false
      matrix:
        variant: [base, sr]       # base = 正式模型; sr = 影子模型 (基準+支撐壓力), 各自一台 runner、各自帳本
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q shioaji requests pandas huggingface_hub
      - name: Run paper trading in Sinopac simulation environment
        env:
          SINOPAC_API_KEY: ${{ secrets.SINOPAC_API_KEY }}
          SINOPAC_SECRET_KEY: ${{ secrets.SINOPAC_SECRET_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          D="${{ github.event.inputs.date }}"; V="${{ matrix.variant }}"
          if [ -n "$D" ]; then python3 scripts/paper_trade.py --publish --variant "$V" --date "$D"; else python3 scripts/paper_trade.py --publish --variant "$V"; fi
      - name: Upload paper results as run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ matrix.variant }}
          path: |
            paper/
            paper_seq/
          if-no-files-found: ignore
          retention-days: 90
