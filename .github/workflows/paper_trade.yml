name: Paper trade (Sinopac simulation, 09:01-13:35)
on:
  # 不用 GitHub 自己的 schedule, 只由 cron-job.org 於平日台灣 08:50 打 workflow_dispatch (見 scripts/setup_cronjob.py)。
  # 腳本自己等 HF 名單 (最晚 09:10) 與 09:01 進場, 跑到 13:35; 若超過 09:04 才進場會自動放棄。
  workflow_dispatch:
    inputs:
      date:
        description: "名單日期 YYYY-MM-DD (留空=今天)"
        default: ""
concurrency:
  group: paper-trade-${{ github.event.inputs.date }}
  cancel-in-progress: false
jobs:
  signals:
    # 名單提早版: 08:50 起先下載 D1、算好不需開盤價的特徵, 09:01:00 抓開盤價後只補算跳空/大盤/支撐壓力, 約 09:01:20 發布到 HF。
    # daily_signals.yml (09:01 觸發) 會先等這裡的結果, 09:02:30 前沒發布才自己算 (備援), 並負責結算/分K。
    if: github.event.inputs.date == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Download D1 (last 6 months) + info and rebuild d1.parquet
        run: python3 -c "import sys; sys.path.insert(0, 'scripts'); from daily_candidates import refresh_d1; refresh_d1(6)"
      - name: Precompute features, wait for 09:01:00, fetch opens, generate main + shadow
        run: python3 -u scripts/daily_candidates.py --variant all --at 09:01
      - name: Publish to HF db/signals
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 09:02:30 起 daily_signals.yml 會自己算 (備援); 太晚就不發布, 免得名單在下單後被換掉
          if [ "$(date +%H%M%S)" -gt 090225 ]; then echo "已過 09:02:25, 交給 daily_signals 備援, 不發布"; exit 0; fi
          python3 scripts/publish_signals.py
  paper:
    strategy:
      fail-fast: false
      matrix:
        variant: [sr, base]       # sr = 正式 (基準+支撐壓力); base = 影子 (基準 33 特徵). 角色見 scripts/config.py, 各自一台 runner、各自帳本
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q shioaji requests pandas huggingface_hub
      - name: Run paper trading in Sinopac simulation environment
        env:
          SINOPAC_API_KEY: ${{ secrets.SINOPAC_API_KEY }}
          SINOPAC_SECRET_KEY: ${{ secrets.SINOPAC_SECRET_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # LINE 開倉/平倉/結算通知 (scripts/notify_line.py). 沒設 secrets 就自動略過; 變體預設只送正式, 要影子也送就在 repo Variables 設 LINE_NOTIFY_VARIANTS=sr,base
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_NOTIFY_VARIANTS: ${{ vars.LINE_NOTIFY_VARIANTS }}
        run: |
          set -o pipefail   # Shioaji 登入時會印含身分證字號的 Session Property 行, 濾掉
          D="${{ github.event.inputs.date }}"; V="${{ matrix.variant }}"
          if [ -n "$D" ]; then python3 scripts/paper_trade.py --publish --variant "$V" --date "$D"; else python3 scripts/paper_trade.py --publish --variant "$V"; fi 2>&1 | grep --line-buffered -v "Session Property"
      - name: Upload paper results as run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ matrix.variant }}
          path: |
            paper/
            paper_seq/
          if-no-files-found: ignore
          retention-days: 90
