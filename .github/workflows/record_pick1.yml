name: Pick-one shadow settle (manual)
# 只做一支影子紀錄的手動補跑。平日 09:01 daily_signals.yml 會自動跑 record_pick1.py; 這個只在要立刻補資料時手動觸發。
on:
  workflow_dispatch:
    inputs:
      months:
        description: "從 HF 抓最近幾個月 D1"
        default: "3"
concurrency:
  group: daily-signals
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Download D1 + rebuild d1.parquet
        run: |
          python3 - "${{ inputs.months }}" <<'PY'
          import sys; sys.path.insert(0, "scripts")
          from daily_candidates import refresh_d1
          refresh_d1(int(sys.argv[1] or 3))
          PY
      - name: Settle pick-one shadow (history_pick1.csv) and refresh reconcile
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 scripts/record_pick1.py
          python3 scripts/reconcile.py --publish --quiet || true
