name: Daily signals (TWSE 09:01)
on:
  # 不用 GitHub 自己的 schedule (會延遲 3~15 分鐘且 60 天沒 commit 會被停用)。
  # 由 cron-job.org 於平日台灣 09:01 準時打 workflow_dispatch (見 scripts/setup_cronjob.py)。
  workflow_dispatch:
    inputs:
      months:
        description: "從 HF 抓最近幾個月 D1"
        default: "6"
      date:
        description: "回放: YYYY-MM-DD 單日 / YYYY-MM 整月 / A..B 區間 (留空=今天即時); 已發布的日期會跳過"
        default: ""
concurrency:
  group: daily-signals
  cancel-in-progress: false
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: pip install -q -r requirements.txt
      - name: Download D1 (last N months) + info and rebuild d1.parquet
        run: |
          MONTHS="${{ github.event.inputs.months }}"; MONTHS="${MONTHS:-6}"
          python3 - "$MONTHS" <<'PY'
          import sys; sys.path.insert(0, "scripts")
          from daily_candidates import refresh_d1
          refresh_d1(int(sys.argv[1]))
          PY
      - name: Wait for the early list (paper_trade.yml signals job publishes ~09:01:20)
        id: early
        if: github.event.inputs.date == ''
        run: |
          python3 - <<'PY'
          import os, time, datetime as dt, requests
          today = dt.date.today().isoformat(); deadline = dt.datetime.combine(dt.date.today(), dt.time(9, 2, 30))
          while True:
              try: d = requests.get("https://huggingface.co/datasets/raywu918daytrade/daytrade/resolve/main/db/signals/latest.json", params={"t": time.time()}, timeout=15).json().get("date")
              except Exception as e: d = None; print("讀 latest.json 失敗:", e)
              if d == today: print("提早版名單已發布, 不重算 (避免開盤價不同造成名單變動)"); skip = "true"; break
              if dt.datetime.now() >= deadline: print("09:02:30 前沒等到提早版名單, 自己算 (備援)"); skip = "false"; break
              time.sleep(3)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"skip={skip}\n")
          PY
      - name: Generate candidates, main + shadow in one pass (fetch opens from TWSE MIS once)
        if: steps.early.outputs.skip != 'true'
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -n "$D" ]; then python3 scripts/daily_candidates.py --date "$D" --variant all --skip-existing; else python3 scripts/daily_candidates.py --variant all; fi
      - name: Publish to HF db/signals
        if: steps.early.outputs.skip != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -n "$D" ]; then python3 scripts/publish_signals.py --all; else python3 scripts/publish_signals.py; fi
      - name: Settle previously published lists with latest D1 (history.csv, forward-only)
        if: always() && github.event.inputs.date == ''      # 補跑 (指定 date) 時跳過, 隔天 09:01 會自動補結算
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 scripts/record_results.py || true
          python3 scripts/record_results.py --variant base || true
      - name: Reconcile settled lists vs paper fills vs real ticks, go-live gate (db/paper/reconcile.*)
        if: always() && github.event.inputs.date == ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 scripts/reconcile.py --publish --quiet || true
          python3 scripts/reconcile.py --publish --quiet --variant base || true
      - name: Build 5-min bars for published lists (bars/<date>.json, from HF db/m1)
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/build_bars.py || true
      - name: Upload signals as run artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signals
          path: signals/
          if-no-files-found: ignore
          retention-days: 30
